/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const product=id=>db.products.find(x=>x.id===+id);const pic=id=>imgs[+id-1]||'';function save(){try{localStorage.setItem(KEY,JSON.stringify(db));return true}catch(e){alert('พื้นที่จัดเก็บเบราว์เซอร์เต็ม ไม่สามารถบันทึกข้อมูลเพิ่มเติมได้');return false}}function go(p){page=p;checkout=false;track=false;render();window.scrollTo(0,0)}function render(){document.getElementById('navStore').classList.toggle('on',page==='store');document.getElementById('navAdmin').classList.toggle('on',page==='admin');document.getElementById('root').innerHTML=page==='admin'?adminView():track?trackView():checkout?checkoutView():storeView()}function stockLeft(p){return Math.max(0,p.stock-(cart[p.id]||0))}function add(id){const p=product(id);if(!p||stockLeft(p)<1)return alert('สินค้าไม่เพียงพอ');cart[id]=(cart[id]||0)+1;render()}function change(id,n){const p=product(id);if(!p)return;const q=Math.max(0,Math.min(p.stock,(cart[id]||0)+n));if(q)cart[id]=q;else delete cart[id];render()}function items(){return Object.entries(cart).filter(([id,q])=>q>0&&product(id)).map(([id,q])=>({...product(id),qty:q}))}function subtotal(){return items().reduce((a,x)=>a+x.qty*x.price,0)}function total(){return subtotal()+(items().length?49:0)}function setCategory(c){category=c;render()}function setSearch(v){search=v;const el=document.getElementById('productGrid');if(el)el.innerHTML=productGrid()}function productGrid(){let ps=db.products.filter(p=>(category==='ทั้งหมด'||p.category===category)&&p.name.toLowerCase().includes(search.toLowerCase()));return ps.length?ps.map(p=>`<article class="product"><img src="${pic(p.id)}" alt="${esc(p.name)}"><div class="prodBody"><div class="cat-label">✿ ${esc(p.category)}</div><h3>${esc(p.name)}</h3><div class="between"><span class="price">${THB(p.price)}</span><button class="btn main small" ${stockLeft(p)<1?'disabled':''} onclick="add(${p.id})">＋</button></div><div class="muted" style="margin-top:9px">พร้อมส่ง ${p.stock} ${esc(p.unit)}</div></div></article>`).join(''):'<div class="empty">ไม่พบสินค้า</div>'}function storeView(){return `<section class="hero"><div class="hero-sky">✦ &nbsp; ✳ &nbsp; ✦</div><div class="hero-content"><div class="hero-label">CHAPTER 01 / WELCOME HOME</div><div class="hero-eyebrow">✿ เปิดประตูสู่โลกของเจ้าเหมียว ✿</div><h1>ของอร่อยใน<br><i>โลกใบเล็ก</i> ของเรา</h1><p>คัดสรรของโปรดทีละชิ้น ด้วยความรักที่มีให้ทุกอุ้งเท้า</p><div class="hero-offer">🎀 ส่งความสุขถึงบ้าน · ค่าส่งเหมา <b>49 บาท</b></div></div><div class="story-art" aria-hidden="true"><div class="sun">✺</div><div class="house-roof"></div><div class="house-body"><div class="house-window">♡</div><div class="house-door">🐈</div></div><div class="flower f1">✿</div><div class="flower f2">✿</div><div class="flower f3">✿</div><div class="grass">✿ ❀ ✿ ❀ ✿</div></div><div class="hero-bottom">JIEWLEK'S LITTLE WORLD <span>EST. WITH LOVE ♡</span></div></section><div class="notice">🌱 เวอร์ชันทดลอง — ออเดอร์บันทึกเฉพาะบนเครื่องนี้ ยังไม่รับชำระเงินจริง</div><section class="story-intro"><span>✳ THE LITTLE COLLECTION ✳</span><h2>เลือกของโปรดให้เจ้านาย <i>♡</i></h2><p>เดินเล่นเลือกของอร่อยจากมุมเล็ก ๆ ของเรา</p></section><div class="category-label">มุมโปรดของน้องแมว <span>↓</span></div><div class="filters">${[['ทั้งหมด','🏡 ทุกมุม'],['เม็ดอบ','🍓 มุมเม็ดอบ'],['ซุป','🥣 มุมซุป'],['เปียก','🐟 มุมอาหารเปียก']].map(([c,label])=>`<button class="chip ${c===category?'on':''}" onclick="setCategory('${c}')">${label}</button>`).join('')}</div><input class="search" placeholder="⌕ ค้นหาของโปรดให้เจ้าเหมียว..." value="${esc(search)}" oninput="setSearch(this.value)"><div id="productGrid" class="grid">${productGrid()}</div><div class="card basket" style="margin-top:30px"><div class="between"><h2>🧺 ตะกร้าของเจ้าเหมียว</h2><span class="badge">${items().reduce((a,x)=>a+x.qty,0)} ชิ้น</span></div>${cartView()}</div><div class="actions"><button class="btn" onclick="track=true;render();window.scrollTo(0,0)">✉ เปิดสมุดติดตามออเดอร์</button></div>`}function cartView(){return items().length?`${items().map(x=>`<div class="line"><img src="${pic(x.id)}"><div class="grow"><b>${esc(x.name)}</b><div class="muted">${THB(x.price)} / ${esc(x.unit)}</div><div class="qty"><button onclick="change(${x.id},-1)">−</button>${x.qty}<button onclick="change(${x.id},1)" ${stockLeft(x)<1?'disabled':''}>+</button></div></div><b>${THB(x.price*x.qty)}</b></div>`).join('')}<div class="sum"><span>รวมสินค้า</span><b>${THB(subtotal())}</b></div><div class="sum"><span>ค่าส่งเหมา</span><b>฿49</b></div><div class="sum total"><span>รวมชำระ</span><span>${THB(total())}</span></div><button class="btn main" style="width:100%" onclick="checkout=true;render();window.scrollTo(0,0)">ดำเนินการสั่งซื้อ →</button>`:'<div class="empty">ยังไม่มีสินค้าในตะกร้า</div>'}function checkoutView(){if(!items().length){checkout=false;return storeView()}return `<button class="btn" onclick="checkout=false;render()">← กลับหน้าร้าน</button><h2>ข้อมูลจัดส่งและสรุปออเดอร์</h2><div class="cols"><section class="card"><label class="label">ชื่อผู้รับ *</label><input id="custName" maxlength="100" value="${esc(customer.name)}" placeholder="ชื่อ-นามสกุล"><label class="label">เบอร์โทร *</label><input id="custPhone" type="tel" maxlength="20" value="${esc(customer.phone)}" placeholder="08xxxxxxxx"><label class="label">ที่อยู่จัดส่ง *</label><textarea id="custAddress" rows="4" placeholder="บ้านเลขที่ ถนน ตำบล อำเภอ จังหวัด รหัสไปรษณีย์">${esc(customer.address)}</textarea><label class="label">หมายเหตุ</label><textarea id="custNote" rows="2">${esc(customer.note)}</textarea><div class="notice" style="margin-top:15px">การสั่งซื้อนี้เป็นการจำลองเท่านั้น ไม่ส่งข้อมูลไปยังร้านจริง โปรดอย่าใส่ข้อมูลส่วนตัวจริงหากไม่จำเป็น</div><button class="btn main" style="width:100%" onclick="placeOrder()">ยืนยันออเดอร์ทดลอง</button></section><section class="card"><h3>สรุปรายการ</h3>${items().map(x=>`<div class="sum"><span>${esc(x.name)} × ${x.qty}</span><b>${THB(x.qty*x.price)}</b></div>`).join('')}<div class="sum"><span>ค่าส่ง</span><b>฿49</b></div><div class="sum total"><span>ยอดรวม</span><b>${THB(total())}</b></div></section></div>`}function placeOrder(){let name=document.getElementById('custName').value.trim(),phone=document.getElementById('custPhone').value.trim(),address=document.getElementById('custAddress').value.trim(),note=document.getElementById('custNote').value.trim();if(!name||!phone||!address)return alert('กรุณากรอกชื่อ เบอร์โทร และที่อยู่ให้ครบ');if(!/^[0-9+()\-\s]{8,20}$/.test(phone))return alert('กรุณาตรวจสอบเบอร์โทร');for(const x of items())if(product(x.id).stock<x.qty)return alert('สินค้า '+x.name+' มีไม่เพียงพอ');customer={name,phone,address,note};const id='JL-'+Date.now().toString(36).toUpperCase();const order={id,created:new Date().toISOString(),name,phone,address,note,items:items().map(x=>({id:x.id,name:x.name,price:x.price,qty:x.qty,unit:x.unit})),shipping:49,amount:total(),payment:'รอตรวจสอบ',status:'รอชำระเงิน',carrier:'',tracking:'',slip:''};db.orders.unshift(order);order.items.forEach(x=>product(x.id).stock-=x.qty);if(!save()){db.orders.shift();order.items.forEach(x=>product(x.id).stock+=x.qty);return}cart={};selected=id;checkout=false;track=true;render();window.scrollTo(0,0)}function orderById(){return db.orders.find(o=>o.id===selected)}function trackView(){const o=orderById();return `<button class="btn" onclick="track=false;render()">← กลับหน้าร้าน</button><h2>ติดตามออเดอร์ทดลอง</h2><div class="card"><label class="label">เลือกออเดอร์ที่สร้างในเครื่องนี้</label><select onchange="selected=this.value;render()"><option value="">เลือกออเดอร์</option>${db.orders.map(x=>`<option value="${esc(x.id)}" ${selected===x.id?'selected':''}>${esc(x.id)} — ${THB(x.amount)}</option>`).join('')}</select></div>${o?`<div class="card"><div class="between"><h3>${esc(o.id)}</h3><span class="badge">${esc(o.status)}</span></div><p>ยอดชำระ <b>${THB(o.amount)}</b> (รวมค่าส่ง ฿49)</p><p>สถานะตรวจสลิป: <b>${esc(o.payment)}</b></p><div class="pill">💳 ช่องทางชำระเงิน: QR ธนาคาร / โอนบัญชี (ยังไม่ตั้งค่าบัญชีจริง)</div><div class="notice" style="margin-top:12px">ไม่มี QR รับเงินจริงในเวอร์ชันนี้ และไม่สามารถยืนยันการชำระเงินจริงได้</div><label class="label">แนบสลิปเพื่อทดลอง</label><input type="file" accept="image/*" onchange="uploadSlip(this.files[0],'${esc(o.id)}')">${o.slip?`<p><img class="slip" src="${o.slip}" alt="สลิปที่แนบ"></p>`:''}<p class="muted">อัปโหลดเฉพาะสลิปตัวอย่างที่ไม่มีข้อมูลส่วนตัว รูปถูกเก็บในเบราว์เซอร์เครื่องนี้</p><div class="sum"><span>บริษัทขนส่ง</span><b>${esc(o.carrier||'ยังไม่ระบุ')}</b></div><div class="sum"><span>เลขพัสดุ</span><b class="break">${esc(o.tracking||'ยังไม่มี')}</b></div></div>`:'<div class="empty">ยังไม่มีออเดอร์ทดลอง เลือกสินค้าจากหน้าร้านเพื่อเริ่มได้เลย</div>'}`}function uploadSlip(file,id){if(!file)return;if(!file.type.startsWith('image/'))return alert('กรุณาเลือกรูปภาพ');if(file.size>3*1024*1024)return alert('กรุณาใช้รูปขนาดไม่เกิน 3 MB');const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas');const k=Math.min(1,900/Math.max(im.width,im.height));c.width=Math.max(1,Math.round(im.width*k));c.height=Math.max(1,Math.round(im.height*k));c.getContext('2d').drawImage(im,0,0,c.width,c.height);const o=db.orders.find(x=>x.id===id);if(!o)return;o.slip=c.toDataURL('image/jpeg',.65);o.payment='รอตรวจด้วยตนเอง';if(save())render()};im.src=r.result};r.readAsDataURL(file)}function adminView(){let o=orderById();const count=db.orders.length, pending=db.orders.filter(x=>x.payment!=='ยืนยันโดยแอดมิน').length;return `<div class="notice">⚠️ หลังบ้านทดลอง ไม่มีรหัสผ่าน ข้อมูลอยู่เฉพาะในเบราว์เซอร์เครื่องนี้ ห้ามใช้กับออเดอร์หรือสลิปจริง</div><div class="between"><h2>⚙ หลังบ้าน Jiewlek & Co.</h2><button class="btn small" onclick="resetDemo()">รีเซ็ตข้อมูลทดลอง</button></div><div class="stats"><div class="card stat"><span class="muted">ออเดอร์</span><b>${count}</b></div><div class="card stat"><span class="muted">รอตรวจ</span><b>${pending}</b></div><div class="card stat"><span class="muted">ยอดออเดอร์</span><b>${THB(db.orders.reduce((a,x)=>a+x.amount,0))}</b></div></div><div class="cols"><section><div class="card"><h3>📦 รายการออเดอร์</h3><input placeholder="ค้นหาเลขออเดอร์หรือชื่อลูกค้า" oninput="filterOrders(this.value)"><div id="orders">${ordersList('')}</div></div><div class="card"><h3>📊 สต๊อกสินค้า</h3>${db.products.map(p=>`<div class="line"><img src="${pic(p.id)}"><div class="grow"><b>${esc(p.name)}</b><div class="muted">${THB(p.price)} / ${esc(p.unit)}</div></div><input style="width:75px" type="number" min="0" value="${p.stock}" aria-label="สต๊อก ${esc(p.name)}" onchange="updateStock(${p.id},this.value)"></div>`).join('')}<p class="muted">ปรับสต๊อกทดลองได้ และจะบันทึกในเบราว์เซอร์นี้</p></div></section><section><div class="card"><h3>รายละเอียดออเดอร์</h3>${o?orderDetail(o):'<div class="empty">เลือกออเดอร์ด้านซ้ายเพื่อจัดการ</div>'}</div></section></div>`}function ordersList(q){const found=db.orders.filter(o=>(o.id+' '+o.name).toLowerCase().includes(q.toLowerCase()));return found.length?found.map(o=>`<div class="order ${selected===o.id?'active':''}" onclick="selected='${esc(o.id)}';render()"><div class="between"><b>${esc(o.id)}</b><b>${THB(o.amount)}</b></div><div class="muted">${esc(o.name)} · ${new Date(o.created).toLocaleString('th-TH')}</div><span class="badge">${esc(o.status)}</span></div>`).join(''):'<div class="empty">ไม่มีออเดอร์</div>'}function filterOrders(q){document.getElementById('orders').innerHTML=ordersList(q)}function orderDetail(o){return `<div class="between"><b class="break">${esc(o.id)}</b><span class="badge">${esc(o.status)}</span></div><p><b>ลูกค้า:</b> ${esc(o.name)}<br><b>โทร:</b> ${esc(o.phone)}<br><b>ที่อยู่:</b> ${esc(o.address)}</p>${o.items.map(x=>`<div class="sum"><span>${esc(x.name)} × ${x.qty}</span><b>${THB(x.price*x.qty)}</b></div>`).join('')}<div class="sum"><span>ค่าส่ง</span><b>฿49</b></div><div class="sum total"><span>ยอดรวม</span><b>${THB(o.amount)}</b></div><hr style="border:0;border-top:1px solid var(--border)"><p><b>การชำระเงิน:</b> ${esc(o.payment)}</p>${o.slip?`<img class="slip" src="${o.slip}" alt="รูปสลิปทดลอง">`:'<p class="muted">ยังไม่ได้แนบสลิป</p>'}<div class="actions"><button class="btn main small" ${!o.slip?'disabled':''} onclick="setPayment('ยืนยันโดยแอดมิน')">✓ แอดมินยืนยัน</button><button class="btn small" onclick="setPayment('ต้องตรวจเพิ่มเติม')">ไม่ผ่าน / ตรวจเพิ่มเติม</button><button class="btn small" onclick="autoCheck()">🤖 ทดลองตรวจอัตโนมัติ</button></div><p class="muted">ปุ่มตรวจอัตโนมัติเป็นการจำลองเท่านั้น ไม่เชื่อม API และไม่อนุมัติการชำระเงินจริง</p><label class="label">สถานะคำสั่งซื้อ</label><select id="statusSel">${['รอชำระเงิน','รอตรวจสลิป','กำลังจัดเตรียม','จัดส่งแล้ว','สำเร็จ','ยกเลิก'].map(s=>`<option ${o.status===s?'selected':''}>${s}</option>`).join('')}</select><label class="label">บริษัทขนส่ง</label><input id="carrier" value="${esc(o.carrier)}" placeholder="เช่น Flash Express"><label class="label">เลขพัสดุ</label><input id="tracking" value="${esc(o.tracking)}" placeholder="เลขติดตามพัสดุ"><button class="btn main" style="margin-top:13px;width:100%" onclick="updateOrder()">บันทึกสถานะและเลขพัสดุ</button>`}function setPayment(s){const o=orderById();if(!o)return;if(s==='ยืนยันโดยแอดมิน'&&!confirm('นี่คือการยืนยันแบบทดลองเท่านั้น คุณตรวจสอบสลิปตัวอย่างแล้วใช่ไหม?'))return;o.payment=s;if(s==='ยืนยันโดยแอดมิน')o.status='กำลังจัดเตรียม';else o.status='รอตรวจสลิป';save();render()}function autoCheck(){const o=orderById();if(!o)return;o.payment='ต้องตรวจเพิ่มเติม (จำลอง API)';o.status='รอตรวจสลิป';save();render();alert('ระบบตรวจสลิปอัตโนมัติยังไม่เชื่อม API จึงส่งออเดอร์ให้แอดมินตรวจเพิ่มเติมเท่านั้น')}function updateOrder(){const o=orderById();if(!o)return;const status=document.getElementById('statusSel').value;if(['กำลังจัดเตรียม','จัดส่งแล้ว','สำเร็จ'].includes(status)&&o.payment!=='ยืนยันโดยแอดมิน')return alert('กรุณายืนยันสลิปในโหมดทดลองก่อนเปลี่ยนเป็นสถานะจัดส่ง');o.status=status;o.carrier=document.getElementById('carrier').value.trim().slice(0,80);o.tracking=document.getElementById('tracking').value.trim().slice(0,100);save();render();alert('บันทึกข้อมูลทดลองแล้ว')}function updateStock(id,v){const n=Number(v);if(!Number.isInteger(n)||n<0)return alert('กรุณาใส่จำนวนเต็มตั้งแต่ 0');product(id).stock=n;save();render()}function resetDemo(){if(!confirm('ลบออเดอร์และคืนค่าสต๊อกทดลองทั้งหมดในเบราว์เซอร์นี้?'))return;db={products:INITIAL.map(({image,...p})=>p),orders:[]};cart={};selected=null;save();render()}render();
</script></body></html>
